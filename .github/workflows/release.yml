name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # <--- C'est cette ligne qui manquait pour autoriser l'écriture !
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: github-workflow-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: github-workflow-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: github-workflow-windows.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mv target/${{ matrix.target }}/release/github-workflow ${{ matrix.bin_name }}

      - name: Prepare binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          move target\${{ matrix.target }}\release\github-workflow.exe ${{ matrix.bin_name }}

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.bin_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}